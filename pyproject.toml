[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dnd-compendium"
version = "0.31.13"
description = "Self-hosted Open5e-powered D&D compendium"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "jinja2>=3.1,<4",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "python-multipart>=0.0.20,<1",
  "pillow>=11.3,<12",
  "markdown-it-py>=3.0,<4",
  "itsdangerous>=2.2,<3",
  "weasyprint>=68,<69",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "pytest-cov>=6.2,<7", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
