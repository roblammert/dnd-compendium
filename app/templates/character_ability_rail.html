<aside id="character-ability-rail" class="character-ability-rail {% if step not in ['background','gear','spells','details','review'] %}is-hidden{% endif %}" data-ability-rail {% if oob|default(false) %}hx-swap-oob="outerHTML"{% endif %} aria-label="Current ability scores"><div class="ability-rail-heading"><span>LIVE ABILITIES</span><small>Updates as build choices change</small></div>{% for ability in abilities %}<article data-rail-ability="{{ ability }}" data-score="{{ derived.scores[ability] }}"><span>{{ ability_names[ability] }}</span><strong data-rail-score>{{ derived.scores[ability] }}</strong><b data-rail-mod>{{ '%+d'|format(derived.modifiers[ability]) }}</b></article>{% endfor %}</aside>
