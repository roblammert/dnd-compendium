{% extends "base.html" %}{% block title %}Profile · D&D Compendium{% endblock %}{% block content %}<section class="profile-shell"><h1>Your profile</h1>{% if request.query_params.get('saved') %}<p class="success-callout">Profile saved.</p>{% endif %}<div class="profile-grid"><div>{% if profile_user.token_asset %}<img class="profile-token" src="/assets/tokens/{{ profile_user.token_asset.storage_name }}" alt="{{ profile_user.display_name }} token">{% else %}<div class="profile-token profile-token-placeholder">{{ profile_user.display_name[:1]|upper }}</div>{% endif %}<form method="post" action="/profile/token" enctype="multipart/form-data"><label>Token image<input type="file" name="image" accept="image/*" required></label><button>Upload token</button></form></div><form method="post"><label>Username<input value="{{ profile_user.username }}" disabled></label><label>Name<input name="display_name" value="{{ profile_user.display_name }}" required></label><label>Email<input type="email" name="email" value="{{ profile_user.email or '' }}"></label><label>New password<input type="password" name="password" minlength="10" placeholder="Leave blank to keep current"></label><button>Save profile</button></form></div></section>{% endblock %}
