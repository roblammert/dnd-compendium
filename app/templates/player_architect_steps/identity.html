<section class="pa-stage" data-pa-stage="identity"><div class="pa-stage-kicker">01</div><header><h2>Identity</h2><p>Establish the character's working identity. The brief description becomes the seed for the later Character Backstory.</p></header><form method="post" action="/tools/player-architect/{{ character.public_id }}/step/identity" data-pa-form><div class="pa-form-grid two"><label>Character Name<input name="name" value="{{ character.name }}" required data-pa-name-input></label><label>Level<input type="number" name="level" min="1" max="20" value="{{ character.level }}" data-pa-level-input></label><label class="wide">Brief Description<textarea name="brief_description" rows="5" maxlength="1500" placeholder="Who is this character in a few sentences?">{{ character.brief_description or '' }}</textarea></label><label>Experience Points (XP)<input type="number" name="experience_points" min="0" value="{{ character.experience_points }}" data-pa-xp-input></label></div><div class="pa-stage-actions"><span></span><button class="primary-action">Save & Continue</button></div></form></section>
