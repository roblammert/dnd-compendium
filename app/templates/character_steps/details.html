<form class="character-step-form" method="post" action="/tools/character-builder/{{ character.public_id }}/step/details" hx-post="/tools/character-builder/{{ character.public_id }}/step/details" hx-target="#character-builder-stage" hx-swap="innerHTML">
<header class="character-step-heading"><div><p class="panel-kicker">08</p><h2>Character Details</h2><p>Complete the roleplaying, appearance, organization, combat-state, and story fields carried onto the printable three-page character record.</p></div><span class="rules-badge">ROLEPLAY</span></header>
<div class="character-form-grid three"><label>Player Name<input name="player_name" value="{{ derived.details.get('player_name','') }}"></label><label>Current HP<input type="number" min="0" name="current_hp" value="{{ derived.current_hp }}"></label><label>Temporary HP<input type="number" min="0" name="temp_hp" value="{{ derived.temp_hp }}"></label></div>
<div class="character-form-grid four"><label>Age<input name="age" value="{{ derived.details.get('age','') }}"></label><label>Height<input name="height" value="{{ derived.details.get('height','') }}"></label><label>Weight<input name="weight" value="{{ derived.details.get('weight','') }}"></label><label>Eyes<input name="eyes" value="{{ derived.details.get('eyes','') }}"></label><label>Skin<input name="skin" value="{{ derived.details.get('skin','') }}"></label><label>Hair<input name="hair" value="{{ derived.details.get('hair','') }}"></label><label>Inspiration<input name="inspiration" value="{{ derived.details.get('inspiration','') }}"></label></div>
<div class="narrative-grid"><label>Personality Traits<textarea name="personality_traits">{{ derived.details.get('personality_traits','') }}</textarea></label><label>Ideals<textarea name="ideals">{{ derived.details.get('ideals','') }}</textarea></label><label>Bonds<textarea name="bonds">{{ derived.details.get('bonds','') }}</textarea></label><label>Flaws<textarea name="flaws">{{ derived.details.get('flaws','') }}</textarea></label><label class="wide">Character Appearance<textarea name="appearance">{{ derived.details.get('appearance','') }}</textarea></label><label class="wide">Character Backstory<textarea name="backstory">{{ derived.details.get('backstory','') }}</textarea></label><label class="wide">Allies & Organizations<textarea name="allies">{{ derived.details.get('allies','') }}</textarea></label><label>Symbol / Affiliation<textarea name="symbol">{{ derived.details.get('symbol','') }}</textarea></label><label>Treasure<textarea name="treasure">{{ derived.details.get('treasure','') }}</textarea></label><label class="wide">Additional Features & Traits<textarea name="additional_features">{{ derived.details.get('additional_features','') }}</textarea></label><label class="wide">Notes<textarea name="notes">{{ derived.details.get('notes','') }}</textarea></label></div>
<footer class="character-step-actions"><button class="secondary-action" name="next_step" value="spells">Previous</button><button name="next_step" value="review">Save & Review</button></footer></form>
