<article class="entity-card" data-entity-type="{{entity.entity_type}}"><div class="card-top"><span class="badge">{{entity.entity_type}}</span><span class="source {{entity.source_kind}}">{{entity.source_kind}}</span></div><h3><a href="/compendium/{{entity.entity_type}}/{{entity.slug}}">{{entity.name}}</a></h3><p>{{entity.summary or entity.data_json.get('desc') or entity.data_json.get('description') or 'No summary available.'}}</p><footer>{{entity.source_document or 'Unknown source'}}</footer></article>
