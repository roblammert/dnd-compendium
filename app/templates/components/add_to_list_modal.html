<dialog id="addToListModal" class="app-modal add-to-list-modal"><form method="post" action="/lists/bulk-add" id="addToListForm"><header><div><p class="eyebrow">Save generated results</p><h2>Add to List</h2></div><button type="button" class="modal-close" data-close-list-modal aria-label="Close">×</button></header><input type="hidden" name="return_to" value="{{ request.url.path if request is defined else "/tools" }}{% if request is defined and request.url.query %}?{{ request.url.query }}{% endif %}"><div id="listEntityInputs"></div>{% if request is defined and request.state.user %}<label>Existing list<select name="list_id"><option value="">Choose a list</option>{% for list in user_lists %}<option value="{{ list.public_id }}">{{ list.name }}</option>{% endfor %}</select></label><div class="modal-divider"><span>or create a new list</span></div><label>New list name<input name="new_list_name" placeholder="New collection"></label><label class="checkbox-label"><input type="checkbox" name="new_list_public" value="1"> Make new list public</label><footer><button type="button" class="secondary-button" data-close-list-modal>Cancel</button><button>Add Selected Rows</button></footer>{% else %}<div class="login-required-panel"><p>You must be signed in to save generated entries to a list.</p><a class="button-link" href="/login?next={{ request.url.path|urlencode if request is defined else "%2Ftools" }}">Sign In</a></div>{% endif %}</form></dialog>
<script>document.addEventListener('DOMContentLoaded',()=>{const modal=document.getElementById('addToListModal'),inputs=document.getElementById('listEntityInputs');document.querySelectorAll('[data-add-results-to-list]').forEach(button=>button.addEventListener('click',()=>{inputs.innerHTML='';document.querySelectorAll('[data-generated-entity-id]').forEach(row=>{const keep=row.querySelector('.keep-checkbox');if(keep && keep.checked===false && button.dataset.onlyKept==='1')return;const value=row.dataset.generatedEntityId;if(value){const hidden=document.createElement('input');hidden.type='hidden';hidden.name='entity_id';hidden.value=value;inputs.appendChild(hidden)}});modal.showModal()}));document.querySelectorAll('[data-close-list-modal]').forEach(button=>button.addEventListener('click',()=>modal.close()))});</script>
