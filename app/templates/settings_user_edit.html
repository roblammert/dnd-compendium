{% extends "settings_layout.html" %}{% block settings_content %}<header><p class="eyebrow">User Management</p><h1>Edit {{target.display_name}}</h1></header><form method="post" class="form-panel user-edit-form"><label>Username<input name="username" value="{{target.username}}" required></label><label>Name<input name="display_name" value="{{target.display_name}}" required></label><label>Email<input type="email" name="email" value="{{target.email or ''}}"></label><label>Role<select name="role">{% for value,label in role_labels.items() %}<option value="{{value}}" {% if target.role==value %}selected{% endif %}>{{label}}</option>{% endfor %}</select></label><label class="checkbox-label"><input type="checkbox" name="is_active" value="1" {% if target.is_active %}checked{% endif %}> Active account</label><label>Reset password<input type="password" name="password" minlength="10" placeholder="Leave blank to keep current"></label><button>Save user</button></form><form method="post" action="/settings/user-management/{{target.public_id}}/delete" onsubmit="return confirm('Delete this user? Their lists will also be deleted.')"><button class="danger-button">Delete user</button></form>{% endblock %}
